name: Deploy Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =======================================================
  # JOB 1 — test:
  # Runs on both push and pull_request to main branch
  # =======================================================
  test:
    name: Test & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run lint check
        run: |
          cd backend
          if npm run | grep -qw "lint"; then
            npm run lint
          else
            echo "no lint"
          fi

      - name: Run a basic health check
        # NOTE: We need to add GET /api/health route in backend/app.js:
        # e.g.:
        #   app.get('/api/health', (req, res) => res.status(200).json({ status: 'ok' }));
        # This endpoint must return HTTP 200 OK for this check.
        env:
          PORT: 8000
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb+srv://smartcart:r8dQinBYA1loqjIp@cluster0.dqjww23.mongodb.net/?appName=Cluster0' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'change-me-to-a-long-random-jwt-secret!!' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'change-me-to-a-long-random-refresh-secret!' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_TbiIhcsXV2uHbL' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || '7QZwmRpD3ZSJaO7cGBunASlD' }}
          CLIENT_URL: ${{ secrets.CLIENT_URL || 'http://localhost:8000' }}
        run: |
          cd backend
          npm start &
          SERVER_PID=$!
          sleep 3
          curl localhost:8000/api/health
          kill $SERVER_PID

  # =======================================================
  # JOB 2 — build:
  # Only runs if test passes, and only on push to main
  # =======================================================
  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartcart-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/smartcart-backend:${{ github.sha }}

  # =======================================================
  # JOB 3 — deploy:
  # Only runs if build passes, and only on push to main
  # =======================================================
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: |
          # Deployment to Railway/Render happens automatically via their GitHub integration.
          # This job is a placeholder for custom deploy scripts if needed.
          echo "Deployment to Railway/Render triggered successfully!"
